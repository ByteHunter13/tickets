services:
  db:
    image: postgres:17
    container_name: tickets_db
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  mailpit:
    image: axllent/mailpit
    container_name: tickets_mail
    ports:
      - "8025:8025" # interfaz web para ver correos
      - "1025:1025" # SMTP

volumes:
  pgdata: